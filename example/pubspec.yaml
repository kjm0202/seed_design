name: seed_design_example
description: "Flutter port of the SEED Design Stackflow SPA example."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  seed_design:
    path: ../

  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  mime: ^2.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  file_selector_platform_interface: ^2.7.0
  url_launcher_platform_interface: ^2.3.2
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/peng.jpeg
  fonts:
    - family: WantedSans
      fonts:
        - asset: assets/fonts/WantedSansVariable.ttf
