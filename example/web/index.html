<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stackflow SPA example for the unofficial Flutter port of SEED Design.">
  <meta name="theme-color" content="#E14D00">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SEED SPA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SEED Design Stackflow SPA</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Match SEED's Vite fontScaling:true document bootstrap before Flutter
       reads data-seed-font-multiplier (official css/theming/index.mjs). -->
  <script>
    (function (window, document) {
      try {
        var root = document.documentElement;
        var android = typeof window.AndroidFunction !== 'undefined';
        root.dataset.seedPlatform = android ? 'android' : 'ios';
        root.dataset.seedFontScaling = 'enabled';

        if (android) {
          var rootSize = parseFloat(window.getComputedStyle(root).fontSize);
          var measured = rootSize > 0 ? rootSize / 16 : 1;
          root.style.setProperty('--seed-static-font-scale', measured.toString());
          var androidScale = Math.max(0.8, Math.min(1.5, measured));
          root.dataset.seedFontMultiplier = parseFloat(androidScale.toFixed(2)).toString();
        } else {
          var probe = document.createElement('div');
          probe.style.cssText = 'position:absolute;visibility:hidden;font-size:16px;font:-apple-system-body;';
          document.body.appendChild(probe);
          var size = parseFloat(window.getComputedStyle(probe).fontSize);
          document.body.removeChild(probe);
          var raw = size > 0 ? (size / 16) * 0.9412 : 1;
          var iosScale = Math.max(0.8, Math.min(1.35, raw));
          root.dataset.seedFontMultiplier = parseFloat(iosScale.toFixed(2)).toString();
        }
      } catch (_) {
        // The Flutter fallback can still calculate a multiplier on older hosts.
      }
    })(window, document);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
